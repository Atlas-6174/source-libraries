# Static hosting for sites/home/dist. Ports the Cloudflare Pages behaviour
# (clean URLs, _redirects, _headers) to nginx.

# Cache policy keyed on response type and path. Evaluated lazily, so
# $sent_http_content_type is available when add_header runs.
map "$sent_http_content_type|$uri" $cache_control {
    "~^text/html"                                           "no-cache";
    "~\|/assets/(site|pro-client)\.js$"                     "public, max-age=0, must-revalidate";
    "~\|/assets/(site|playground|examples)\.css$"           "public, max-age=0, must-revalidate";
    "~\|/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$"      "public, max-age=31536000, immutable";
    default                                                 "public, max-age=3600";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/wasm;

    # Security headers.
    # CSP notes: upstream pages use inline <script> blocks and on* handlers,
    # so script-src keeps 'unsafe-inline' (tracked for hardening). No
    # 'unsafe-eval': the Studio compiles agent-written cores with
    # new Function, and the agent is disabled in this build. connect-src only
    # allows the public npm/GitHub stats APIs besides this origin, so nothing
    # can reach the hosted Pro API. Google Fonts until fonts are self-hosted.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://api.npmjs.org https://api.github.com; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # voice-glow reads the microphone on its demos; everything else is off.
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Ported from public/_redirects.
    location = /avatars.html { return 301 /bots.html; }
    location = /avatars      { return 301 /bots.html; }

    # Pricing and account pages do not exist in this build; old links and
    # in-page "Get Pro" CTAs land on the open Studio instead.
    location ~ ^/(pro|account|activate|success)(\.html)?$ { return 302 /studio/app; }

    # Endpoints of the hosted API that the pages may still call: answer
    # locally with a JSON error so their existing failure paths run.
    location ~ ^/(feedback|studio/chat|me|geo|checkout|portal|presets(/.*)?|(content|auth|team|device)/.*)$ {
        default_type application/json;
        return 503 '{"error":"unavailable"}';
    }

    # Never serve Cloudflare-only control files.
    location ~ ^/_(headers|redirects)$ { return 404; }

    # Clean URLs: /studio -> studio.html, /studio/app -> studio/app.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
