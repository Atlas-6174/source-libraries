# npm dependencies are governed by upstream and arrive with upstream syncs.
# Dependabot only tracks what this fork owns: base images and CI actions.
version: 2
updates:
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
