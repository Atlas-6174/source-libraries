# Verifies every pull request and push to main:
# typecheck -> image build -> size budget -> vulnerability scan ->
# run the hardened container -> browser check (no foreign hosts, no CSP
# violations, Studio opens).
#
# Linux runners only: the deliverable is a Linux container, which Docker
# Desktop runs on macOS and Windows. arm64 is built in release.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/atlas-6174/source-libraries:ci
  # Pinned by version and digest; bump both together.
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  # PERF_BUDGETS.md: compressed image size.
  IMAGE_BUDGET_BYTES: "50000000"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the build stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: build
          load: true
          tags: source-libraries-build:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Typecheck
        run: docker run --rm source-libraries-build:ci npm run typecheck -w @sites/home

      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha

      - name: Check image size budget
        run: |
          docker save "$IMAGE" -o image.tar
          size=$(gzip -c image.tar | wc -c)
          echo "Compressed image: $size bytes (budget $IMAGE_BUDGET_BYTES)"
          test "$size" -le "$IMAGE_BUDGET_BYTES"

      - name: Scan image (HIGH/CRITICAL with a fix available)
        # Scans the saved tarball; no Docker socket or secrets are exposed.
        run: |
          docker run --rm -v "$PWD/image.tar:/image.tar:ro" "$TRIVY_IMAGE" \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --no-progress --exit-code 1

      - name: Start the container
        run: |
          docker compose up -d --no-build --wait --wait-timeout 30
          docker compose ps

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Browser check
        run: node scripts/verify-site.mjs http://127.0.0.1:8080

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Stop the container
        if: always()
        run: docker compose down
