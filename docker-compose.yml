name: source-libraries

services:
  web:
    image: ${IMAGE:-ghcr.io/atlas-6174/source-libraries:local}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp  # nginx-unprivileged keeps its pid and temp files here
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      start_interval: 1s
      retries: 3
